services:
  - type: web
    name: ai-predictive-maintenance-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: CORS_ORIGINS
        value: "*"
      - key: EMAIL_ALERTS_ENABLED
        value: "true"
      - key: ALERT_RISK_THRESHOLD
        value: "60"
      - key: ALERT_COOLDOWN_MINUTES
        value: "15"
      - key: DATABASE_URL
        fromDatabase:
          name: predictive-maintenance-db
          property: connectionString

databases:
  - name: predictive-maintenance-db
    databaseName: maintenance
    user: postgres
    plan: free
